name: hello-world
on:
  # Auto trigger on any commit
  push: 
    branches: 
      - '**'
  # Manual trigger with branch selection
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to run the workflow on"
        required: true
        default: "main"
        type: string
        
jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
      - name: my-step
        run: echo "Hello World 😊"
